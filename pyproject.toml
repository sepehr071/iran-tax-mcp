[project]
name = "iran-tax-mcp"
version = "0.1.2"
description = "Unofficial read-only MCP server for Iranian tax services: goods/service IDs and VAT, activity codes, property values, tax laws and circulars."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sepehr Radmard", email = "sepehrr80@gmail.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "mcp-server", "model-context-protocol", "iran", "persian", "tax", "iran-tax", "vat", "moadian", "e-invoice", "tax-gov-ir", "activity-code", "property-value", "tax-law", "accounting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "httpx-curl-cffi>=0.1.5",
    "curl-cffi>=0.16.3",
]

[project.urls]
Homepage = "https://github.com/sepehr071/iran-tax-mcp"
Issues = "https://github.com/sepehr071/iran-tax-mcp/issues"

[project.scripts]
iran-tax-mcp = "iran_tax_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real tax sites (run with -m live)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long Field(description=...) strings read better on one line
