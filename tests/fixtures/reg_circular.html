<script>let chlist = [{"ti": "کل متن", "tk": "txs1879545940650572", "pcode": null, "ord": 1, "s80512493": "بند زیر جایگزین <a title=\"برای مشاهده متن، کلیک کنید.\" href=\"https://regulation.tax.gov.ir/lwvi?ty=mq&amp;lid=txs5000090481&amp;pid=txs1819220394658433\" target=\"_blank\" rel=\"noopener\"><span style=\"text-decoration: underline;\">بند (3) بخشنامه شماره 200/1403/39 مورخ 1403/09/20</span></a> از تاریخ صدور می&zwnj;شود:\r\n&laquo;3- در راستای اجرای الزامات فوق الذکر مقرر می&zwnj;دارد، آن دسته از پرداختی&zwnj;هایی که مطابق با موافقت&zwnj;نامه با سازمان برنامه و بودجه کشور (موضوع <a title=\"برای مشاهده متن، کلیک کنید.\" href=\"https://regulation.tax.gov.ir/lwvi?ty=qh&amp;lid=txs5000088252&amp;pid=txs5000107956\" target=\"_blank\" rel=\"noopener\"><span style=\"text-decoration: underline;\">ماده 40 قانون الحاق موادی به قانون تنظیم برخی از مقررات مالی دولت (1)</span></a>) صورت می&zwnj;گیرد، همچنین مزایایی که سقف یا مبلغ آن به تصویب هیئت وزیران یا شورای عالی کار می&zwnj;رسد (از قبیل کمک هزینه مسکن، کمک هزینه عائله&zwnj;مندی، حق اولاد و کمک هزینه اقلام مصرفی خانوار)، از حیث اجرای این بخشنامه در حدود متعارف شناخته می&zwnj;شود.\r\nدر مورد سایر پرداختی&zwnj;ها نیز، حدود متعارف براساس اسناد و مدارک و در چارچوب قوانین، مقررات و آرای دیوان عدالت اداری، مورد رسیدگی و تشخیص قرار خواهد گرفت.&raquo;\r\nسید محمدهادی سبحانیان\r\nرئیس کل سازمان امور مالیاتی کشور"}, {"ti": "مقررات منسوخ", "tk": "txs1879547260276418", "pcode": null, "ord": 2, "s80512493": "مقررات منسوخ: &nbsp;<a title=\"برای مشاهده متن، کلیک کنید.\" href=\"lwvi?lid=txs5000096288&amp;ty=mq&amp;txt=8733\" target=\"_blank\" rel=\"noopener\"><span style=\"text-decoration: underline;\">نامه شماره 210/87338/د مورخ 1403/11/23 معاونت وقت حقوقی و فنی سازمان امور مالیاتی کشور</span></a> از تاریخ صدور"}];
